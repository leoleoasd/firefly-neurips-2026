[package]
edition = "2021"
name = "proxy_client_sigv4"
version = "0.1.0"

[dependencies]
tokio = {version = "1.39", features = ["rt-multi-thread", "macros", "signal", "sync"]}

# Hyper 1.x server (HTTP/1 proxy listener)
http = "1.1"
http-body-util = "0.1"
hyper = {version = "1.4", features = ["http1", "server"]}
hyper-util = {version = "0.1", features = ["tokio"]}

bytes = "1.7"
reqwest = {version = "0.12", default-features = false, features = ["http2", "rustls-tls", "json"]}

serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"

moka = {version = "0.12", features = ["future"]}
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter", "fmt"]}
uuid = {version = "1.10", features = ["v4"]}

aws-config = "1.5"
aws-credential-types = "1.2"
aws-sigv4 = "1.3"
aws-smithy-runtime-api = "1.8"

anyhow = "1.0"
futures = "0.3"
httpdate = "1.0"
tower-service = "0.3"
url = "2.5"

# Session stickiness (lock-free)
arc-swap = "1.7"
dashmap = "5.5"
